<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="A delightfully spooky service rating kiosk for Snacks for Vampires." />
    <meta name="theme-color" content="#3a0f23" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Rate Our Service | Snacks for Vampires</title>
    <link rel="icon" href="favicon.svg?v=19" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest?v=19" />
    <link rel="stylesheet" href="styles.css?v=19" />
    <link rel="stylesheet" href="kiosk.css?v=19" />
    <script src="app.js?v=19" defer></script>
  </head>
  <body>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <main class="kiosk-shell">
      <section class="rating-card" aria-labelledby="page-title">
        <header class="kiosk-header">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <path d="M10 9h44v21c0 17-10.5 26-22 30C20.5 56 10 47 10 30V9Z" />
                <path class="brand__fang" d="M17 19h13l-6.5 19L17 19Zm17 0h13l-6.5 19L34 19Z" />
              </svg>
            </span>
            <strong>Snacks for Vampires</strong>
          </div>

          <div class="header-actions">
            <div class="ticket" aria-label="Now serving">
              <span id="ticket-caption">Now serving</span>
              <strong id="victim-number">V-001</strong>
            </div>
            <button class="menu-button" id="menu-button" type="button" aria-haspopup="dialog">
              <span aria-hidden="true">☰</span>
              <strong>Menu</strong>
            </button>
          </div>
        </header>

        <div class="kiosk-content">
          <h1 id="page-title">How fang-tastic was the service?</h1>

          <section class="rating-zone" aria-label="Rate the service">
            <div class="ratings" role="group" aria-label="Choose a service rating">
              <button class="rating rating--awful" type="button" data-rating="awful" aria-label="Terrible">
                <span class="face" aria-hidden="true">
                  <span class="face__eyes"></span>
                  <span class="face__mouth face__mouth--sad"></span>
                </span>
                <span class="rating__label">Terrible</span>
              </button>

              <button class="rating rating--meh" type="button" data-rating="meh" aria-label="Could be better">
                <span class="face" aria-hidden="true">
                  <span class="face__eyes"></span>
                  <span class="face__mouth face__mouth--flat"></span>
                </span>
                <span class="rating__label">Could be better</span>
              </button>

              <button class="rating rating--good" type="button" data-rating="good" aria-label="Pretty good">
                <span class="face" aria-hidden="true">
                  <span class="face__eyes"></span>
                  <span class="face__mouth face__mouth--smile"></span>
                </span>
                <span class="rating__label">Pretty good</span>
              </button>

              <button class="rating rating--great" type="button" data-rating="great" aria-label="Fang-tastic">
                <span class="face" aria-hidden="true">
                  <span class="face__eyes"></span>
                  <span class="face__mouth face__mouth--grin"></span>
                </span>
                <span class="rating__label">Fang-tastic</span>
              </button>
            </div>

          </section>
        </div>

      </section>
    </main>

    <div class="rating-reactions" id="rating-reactions" aria-hidden="true"></div>

    <div class="menu-modal" id="menu-modal" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
      <section class="menu-dialog">
        <header class="menu-dialog__header">
          <h2 id="menu-title">Menu</h2>
          <button class="icon-button" id="close-menu" type="button" aria-label="Close menu">×</button>
        </header>

        <div class="menu-dialog__body" id="menu-home">
          <section class="menu-section instagram-section" aria-label="Instagram profiles">
            <div class="instagram-buttons">
              <button
                class="instagram-button"
                type="button"
                data-qr-name="Valdemar"
                data-qr-src="assets/instagram-valdemar-red-purple.png?v=19"
                data-qr-mask="assets/instagram-valdemar-mask.png?v=19"
              >
                <span class="instagram-glyph" aria-hidden="true">◎</span>
                <span>Valdemar</span>
              </button>
              <button
                class="instagram-button"
                type="button"
                data-qr-name="Christian"
                data-qr-src="assets/instagram-christian-red-purple.png?v=19"
                data-qr-mask="assets/instagram-christian-mask.png?v=19"
              >
                <span class="instagram-glyph" aria-hidden="true">◎</span>
                <span>Christian</span>
              </button>
            </div>
          </section>

          <section class="menu-section stats-section" aria-labelledby="stats-title">
            <div class="stats-heading">
              <h3 id="stats-title">Tonight&rsquo;s ratings</h3>
              <strong id="stats-total">0 votes</strong>
            </div>

            <div class="stats-list">
              <div class="stat-row" data-stat="awful">
                <span>Terrible</span>
                <div class="stat-track"><span class="stat-fill"></span></div>
                <strong>0</strong>
              </div>
              <div class="stat-row" data-stat="meh">
                <span>Could be better</span>
                <div class="stat-track"><span class="stat-fill"></span></div>
                <strong>0</strong>
              </div>
              <div class="stat-row" data-stat="good">
                <span>Pretty good</span>
                <div class="stat-track"><span class="stat-fill"></span></div>
                <strong>0</strong>
              </div>
              <div class="stat-row" data-stat="great">
                <span>Fang-tastic</span>
                <div class="stat-track"><span class="stat-fill"></span></div>
                <strong>0</strong>
              </div>
            </div>
          </section>
        </div>

        <div class="qr-view" id="qr-view" hidden>
          <div class="qr-view__copy">
            <button class="back-button" id="back-to-menu" type="button">← Back to menu</button>
            <h3 id="qr-heading" tabindex="-1">Find <span id="qr-name">Valdemar</span></h3>
          </div>
          <div class="qr-art" id="qr-art">
            <img id="qr-image" src="" alt="" />
            <canvas id="qr-canvas" aria-hidden="true"></canvas>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
